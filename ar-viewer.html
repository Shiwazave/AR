<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AR Просмотр 3D Объекта</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@300;700&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #13131a;
      --accent: #00ffe7;
      --accent2: #7b5cff;
      --text: #e8e8f0;
      --muted: #55556a;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Unbounded', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    /* Animated background grid */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,255,231,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,231,.04) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    header {
      position: relative;
      z-index: 1;
      width: 100%;
      padding: 28px 24px 0;
      text-align: center;
    }

    .badge {
      display: inline-block;
      padding: 4px 14px;
      border: 1px solid var(--accent);
      border-radius: 99px;
      font-size: 10px;
      letter-spacing: .18em;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 14px;
      animation: glow 2s ease-in-out infinite alternate;
    }

    @keyframes glow {
      from { box-shadow: 0 0 6px #00ffe730; }
      to   { box-shadow: 0 0 18px #00ffe760; }
    }

    h1 {
      font-size: clamp(18px, 5vw, 28px);
      font-weight: 700;
      letter-spacing: -.02em;
      background: linear-gradient(120deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.2;
    }

    .subtitle {
      margin-top: 8px;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: .1em;
      font-weight: 300;
    }

    .viewer-wrap {
      position: relative;
      z-index: 1;
      width: min(100%, 520px);
      margin: 24px auto 0;
      padding: 0 16px;
    }

    .viewer-frame {
      position: relative;
      border: 1px solid rgba(0,255,231,.18);
      border-radius: 20px;
      overflow: hidden;
      background: var(--surface);
      box-shadow:
        0 0 0 1px rgba(123,92,255,.15),
        0 32px 64px rgba(0,0,0,.6),
        inset 0 1px 0 rgba(255,255,255,.05);
    }

    /* Corner accents */
    .viewer-frame::before,
    .viewer-frame::after {
      content: '';
      position: absolute;
      width: 20px; height: 20px;
      z-index: 2;
      pointer-events: none;
    }
    .viewer-frame::before {
      top: 12px; left: 12px;
      border-top: 2px solid var(--accent);
      border-left: 2px solid var(--accent);
    }
    .viewer-frame::after {
      bottom: 12px; right: 12px;
      border-bottom: 2px solid var(--accent2);
      border-right: 2px solid var(--accent2);
    }

    model-viewer {
      width: 100%;
      height: 58vw;
      max-height: 380px;
      background: transparent;
      --poster-color: transparent;
    }

    .ar-btn-wrap {
      padding: 16px;
      display: flex;
      justify-content: center;
    }

    .ar-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 28px;
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      border: none;
      border-radius: 99px;
      color: #0a0a0f;
      font-family: 'Unbounded', sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .08em;
      cursor: pointer;
      transition: transform .2s, box-shadow .2s;
      box-shadow: 0 8px 24px rgba(0,255,231,.25);
    }

    .ar-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(0,255,231,.4);
    }

    .ar-btn svg { flex-shrink: 0; }

    .tip {
      text-align: center;
      font-size: 10px;
      color: var(--muted);
      letter-spacing: .08em;
      padding: 0 24px 32px;
      line-height: 1.7;
      position: relative;
      z-index: 1;
    }

    .tip strong { color: var(--accent); font-weight: 700; }

    /* Model-viewer built-in AR button override */
    model-viewer::part(default-ar-button) {
      display: none;
    }

    .no-ar-note {
      display: none;
      font-size: 11px;
      color: var(--muted);
      text-align: center;
      padding: 0 24px 16px;
    }
  </style>
</head>
<body>

<header>
  <div class="badge">WebAR · GLB Object</div>
  <h1>3D Просмотр<br>в реальности</h1>
  <p class="subtitle">Наведите телефон на поверхность и поместите объект</p>
</header>

<div class="viewer-wrap">
  <div class="viewer-frame">
    <model-viewer
      id="mv"
      src="untitled222.glb"
      alt="3D объект"
      camera-controls
      auto-rotate
      auto-rotate-delay="1000"
      rotation-per-second="30deg"
      shadow-intensity="1"
      ar
      ar-modes="webxr scene-viewer quick-look"
      ar-scale="auto"
      environment-image="neutral"
      exposure="1"
    ></model-viewer>

    <div class="ar-btn-wrap">
      <button class="ar-btn" onclick="launchAR()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M3 7V5a2 2 0 0 1 2-2h2"/>
          <path d="M17 3h2a2 2 0 0 1 2 2v2"/>
          <path d="M21 17v2a2 2 0 0 1-2 2h-2"/>
          <path d="M7 21H5a2 2 0 0 1-2-2v-2"/>
          <path d="M12 8l4 2.4V14L12 16.4 8 14V10.4L12 8z"/>
        </svg>
        ОТКРЫТЬ В AR
      </button>
    </div>
  </div>
</div>

<p class="tip">
  <strong>iOS</strong> — Safari (Quick Look) &nbsp;·&nbsp; <strong>Android</strong> — Chrome (Scene Viewer / WebXR)<br>
  Перетащите модель пальцем · щипком масштабируйте
</p>

<script>
  function launchAR() {
    const mv = document.getElementById('mv');
    if (mv && mv.canActivateAR) {
      mv.activateAR();
    } else {
      document.querySelector('.no-ar-note').style.display = 'block';
    }
  }
</script>

</body>
</html>
